name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[pdf,dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: sicilahval demo --out "$RUNNER_TEMP/demo" --language tr
      - run: sicilahval install-skill --target agents --path "$RUNNER_TEMP/skills"
      - run: python "$RUNNER_TEMP/skills/sicilahval/scripts/sicilahval.py" demo --out "$RUNNER_TEMP/standalone-demo" --language en
